          <!-- Les trois signes de structure du langage, et EUX SEULS : ils achèvent

               signe lui-même (il montre ce qu'il insère), et leur nom accessible
               vient du dictionnaire, comme le bouton de menu plus haut.

               in Name », niveau A) : sans cela, un nom entièrement disjoint de
               l'étiquette visible rend ces trois boutons inatteignables à la
               commande vocale — qui dit ce qu'elle voit. Le quatrième ne pose pas
               la question : son libellé visible EST son nom. -->
          <span class="actions">
