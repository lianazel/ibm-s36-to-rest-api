<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- CSP stricte : tout vient du dépôt, aucun inline, aucun tiers (polices auto-hébergées). -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <!-- Valeurs initiales en français (le document doit en porter avant le JS) ;
       le mécanisme i18n (data-i18n-attr, document.title) les resynchronise à la bascule. -->
  <title>Des fichiers S/36 à l'API REST</title>
  <meta name="description" data-i18n-attr="content:meta.description"
        content="Une API REST .Net qui expose en JSON des fichiers hérités IBM S/36 tournant sur IBM i : architecture réelle, testée, expliquée.">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/menu.js"></script>
</head>
<body>
  <header class="site-header">
    <h1 class="brand" data-i18n="site.title"></h1>
    <button type="button" id="lang-switch" class="lang-switch" data-i18n="lang.switch"></button>
    <button type="button" id="nav-toggle" class="nav-toggle"
            aria-expanded="false" aria-controls="nav-panel"
            aria-label="Ouvrir le menu" data-i18n-attr="aria-label:menu.open">
      <!-- Deux tracés, un seul visible : la classe portée par <html> bascule. -->
      <svg class="nav-toggle-icon" viewBox="0 0 24 24" width="24" height="24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           aria-hidden="true" focusable="false">
        <path class="icon-burger" d="M4 7h16M4 12h16M4 17h16"></path>
        <path class="icon-close" d="M6 6l12 12M18 6L6 18"></path>
      </svg>
    </button>
  </header>

  <div id="nav-overlay" class="nav-overlay"></div>

  <!-- Panneau hors de l'en-tête, et non dedans : un descendant positionné peint
       toujours au-dessus du fond de son parent, quel que soit son z-index — le
       panneau ouvert recouvrirait sa propre croix. En flux (sans JavaScript),
       il se lit à la place où il est écrit, juste sous l'en-tête.
       role="dialog" et aria-modal sont posés par js/menu.js : sans lui, le
       document entier doit rester lisible. -->
  <div id="nav-panel" class="nav-panel" aria-label="Menu" data-i18n-attr="aria-label:menu.title">
    <nav class="site-nav" aria-label="Sections" data-i18n-attr="aria-label:nav.aria">
      <ul>
        <li><a href="#decor" data-i18n="nav.decor"></a></li>
        <li><a href="#probleme" data-i18n="nav.probleme"></a></li>
        <li><a href="#solution" data-i18n="nav.solution"></a></li>
        <li><a href="#mini-langage" data-i18n="nav.minilangage"></a></li>
        <li><a href="#methode" data-i18n="nav.methode"></a></li>
        <li><a href="#annexe" data-i18n="nav.annexe"></a></li>
      </ul>
    </nav>

    <section class="about">
      <h2 data-i18n="about.title"></h2>
      <p class="about-name" data-i18n="about.name"></p>
      <p data-i18n="about.license"></p>
      <p>
        <a href="https://twaim-web.vercel.app/" target="_blank" rel="noopener noreferrer"
           data-i18n="about.twaim" data-i18n-attr="href:about.twaimUrl"></a>
      </p>
      <!-- Révélé par js/menu.js sur `?from=portfolio` uniquement, jamais autrement. -->
      <p>
        <a href="https://lianazel.github.io/" rel="noopener noreferrer"
           data-portfolio-link data-i18n="about.portfolio" hidden></a>
      </p>
    </section>
  </div>

  <main>
    <section id="decor">
      <p class="tagline" data-i18n="hero.tagline"></p>
      <h2 data-i18n="section1.title"></h2>
      <p data-i18n="section1.intro"></p>

      <h3 data-i18n="section1.lignees.title"></h3>
      <p data-i18n="section1.lignees.p1"></p>
      <p data-i18n="section1.lignees.p2"></p>

      <h3 data-i18n="section1.pont.title"></h3>
      <p data-i18n="section1.pont.p1"></p>
      <p data-i18n="section1.pont.p2"></p>

      <h3 data-i18n="section1.noms.title"></h3>
      <p data-i18n="section1.noms.p1"></p>
      <p data-i18n="section1.noms.p2"></p>

      <h3 data-i18n="section1.preuve.title"></h3>
      <p data-i18n="section1.preuve.p1"></p>
      <p data-i18n="section1.preuve.p2"></p>
      <p data-i18n="section1.preuve.p3"></p>
    </section>

    <section id="probleme">
      <h2 data-i18n="section2.title"></h2>
      <p data-i18n="section2.intro"></p>
      <p><span data-i18n="section2.renvoi"></span> <a href="#annexe" data-i18n="section2.renvoiLien"></a></p>
    </section>

    <section id="solution">
      <h2 data-i18n="section3.title"></h2>
      <p data-i18n="section3.intro"></p>

      <h3 data-i18n="section3.modele.title"></h3>
      <p data-i18n="section3.modele.p1"></p>
      <p data-i18n="section3.modele.p2"></p>

      <figure class="extrait">
        <figcaption data-i18n="section3.modele.code1.legende"></figcaption>
        <pre tabindex="0"><code data-i18n="section3.modele.code1.source"></code></pre>
      </figure>

      <figure class="extrait">
        <figcaption data-i18n="section3.modele.code2.legende"></figcaption>
        <pre tabindex="0"><code data-i18n="section3.modele.code2.source"></code></pre>
      </figure>

      <h3 data-i18n="section3.mur.title"></h3>
      <p data-i18n="section3.mur.p1"></p>

      <h3 data-i18n="section3.renversement.title"></h3>
      <p data-i18n="section3.renversement.p1"></p>
      <p data-i18n="section3.renversement.p2"></p>

      <figure class="extrait">
        <figcaption data-i18n="section3.renversement.code3.legende"></figcaption>
        <pre tabindex="0"><code data-i18n="section3.renversement.code3.source"></code></pre>
      </figure>

      <p data-i18n="section3.renversement.p3"></p>

      <h3 data-i18n="section3.etape.title"></h3>
      <p data-i18n="section3.etape.p1"></p>
    </section>

    <section id="mini-langage">
      <h2 data-i18n="section4.title"></h2>
      <p data-i18n="section4.intro"></p>
    </section>

    <section id="methode">
      <h2 data-i18n="section5.title"></h2>
      <p data-i18n="section5.intro"></p>
    </section>

    <section id="annexe">
      <h2 data-i18n="annexe.title"></h2>
      <p data-i18n="annexe.intro"></p>
      <p data-i18n="annexe.attente"></p>
      <p><a href="#probleme" data-i18n="annexe.retour"></a></p>
    </section>
  </main>

  <footer class="site-footer">
    <p data-i18n="footer.notice"></p>
    <p class="disclaimer" data-i18n="footer.disclaimer"></p>
    <p><a href="https://lianazel.github.io/" rel="noopener noreferrer"
          data-portfolio-link data-i18n="footer.portfolio" hidden></a></p>
  </footer>
</body>
</html>
