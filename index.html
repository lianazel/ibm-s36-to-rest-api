      <!-- La légende est posée une seule fois, juste avant les premières

      <!-- Le bouton fabrique une INTENTION : sans lui, le lecteur qui casse une
           jointure a fait une fausse manœuvre et subit un message ; avec lui, il
           a décidé d'ouvrir les données, puis choisi sa cellule. On n'apprend
           pas d'un accident, on apprend d'une expérience. -->
      <p class="edition">
        <button type="button" id="mini-edition" aria-pressed="false"
                data-i18n="section4.edition.bouton"></button>
      </p>
      <p id="mini-edition-note" class="edition-note" data-i18n="section4.edition.note" hidden></p>

      <div id="mini-simulateur" class="simulateur">
        <h3 data-i18n="section4.zone1.titre"></h3>

        <p class="champ">
          <label for="mini-filtre" data-i18n="section4.champ.filtre"></label>
          <!-- Une zone REPLIÉE, et non plus une ligne : la plus longue expression
               que la page écrit fait 83 caractères en anglais, quand aucune largeur
               disponible n'en montre plus de 66. Sur une ligne, le champ cachait
               forcément une partie de ce que le lecteur venait de poser. -->
          <textarea id="mini-filtre" rows="3" autocomplete="off" autocapitalize="off"
                    autocorrect="off" spellcheck="false"></textarea>
          <!-- Les trois signes de structure du langage, et EUX SEULS : ils achèvent
               un geste commencé, ils n'apprennent pas à taper. Leur étiquette est le
               signe lui-même (il montre ce qu'il insère), et leur nom accessible
               vient du dictionnaire, comme le bouton de menu plus haut. -->
          <span class="actions">
            <button type="button" id="mini-fermer" class="signe"
                    aria-label="Fermer la séquence"
                    data-i18n-attr="aria-label:section4.champ.fermer">/&gt;</button>

          </span>
